<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame and MindAR Libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Paths updated to match the "3d Assets" folder -->
        <a-asset-item id="zeusModel" src="./3d Assets/Zeus.glb"></a-asset-item>
        <a-asset-item id="dominoModel" src="./3d Assets/Domino.glb"></a-asset-item>
        <a-asset-item id="astroModel" src="./3d Assets/model1.glb"></a-asset-item>
        <a-asset-item id="earthModel" src="./3d Assets/Earth.glb"></a-asset-item>
        <a-asset-item id="dnaModel" src="./3d Assets/DNA.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Zeus -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#zeusModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
      </a-entity>

      <!-- Target 1: Domino -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#dominoModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
      </a-entity>

      <!-- Target 2: Astrocalculator -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#astroModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
      </a-entity>

      <!-- Target 3: Earth -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#earthModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
      </a-entity>

      <!-- Target 4: DNA -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model src="#dnaModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
      </a-entity>

    </a-scene>
  </body>
</html><!DOCTYPE html>
<html>
  <head>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <body>
    <!-- AR Scene Container -->
    <a-scene

      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Preload 3D Models and Images -->
        <a-asset-item id="model1" src="./assets/model.glb"></a-asset-item>
        <img id="label1" src="./assets/overlay.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 (First Book Cover) -->
      <a-entity mindar-image-target="targetIndex: 0">

        <a-gltf-model src="#model1" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>

        <a-image src="#label1" position="0 0.5 0" height="0.3" width="0.6"></a-image>
      </a-entity>
    </a-scene>
  </body>
</html>
