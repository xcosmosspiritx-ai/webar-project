<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame & MindAR Libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- AR Scene Container -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Preload 3D Models and Images -->
        <a-asset-item id="model1" src="./assets/model.glb"></a-asset-item>
        <img id="label1" src="./assets/overlay.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0 (First Book Cover) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 3D Asset Overlay -->
        <a-gltf-model src="#model1" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
        <!-- 2D UI Overlay -->
        <a-image src="#label1" position="0 0.5 0" height="0.3" width="0.6"></a-image>
      </a-entity>
    </a-scene>
  </body>
</html>
