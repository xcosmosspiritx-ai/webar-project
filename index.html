<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A-Frame and MindAR Libraries -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <!-- Animation Mixer Extra Component for Animated .GLB Files -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="zeusModel" src="./3dAssets/Zeus.glb"></a-asset-item>
        <a-asset-item id="dominoModel" src="./3dAssets/Domino.glb"></a-asset-item>
        <a-asset-item id="astroModel" src="./3dAssets/model1.glb"></a-asset-item>
        <a-asset-item id="earthModel" src="./3dAssets/Earth.glb"></a-asset-item>
        <a-asset-item id="dnaModel" src="./3dAssets/DNA.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: Alice Roberts (Orrery / Astrocalculator) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#astroModel" position="0 0.1 0" scale="1.5 1.5 1.5" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>

      <!-- Target 1: Weather (Earth) -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model src="#earthModel" position="0 0.1 0" scale="1.0 1.0 1.0" rotation="1 0 0"></a-gltf-model>
      </a-entity>

      <!-- Target 2: John Dee (DNA - 4x Enlarged) -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model src="#dnaModel" position="0 0.1 0" scale="9.0 9.0 9.0" rotation="0 0 0" animation-mixer></a-gltf-model>
      </a-entity>

      <!-- Target 3: Mythos (Zeus) -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model src="#zeusModel" position="0 0.1 0" scale="1.5 1.5 1.5" rotation="0 0 0"></a-gltf-model>
      </a-entity>

      <!-- Target 4: Coincidence (Domino) -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model src="#dominoModel" position="0 0.1 0" scale="1.5 1.5 1.5" rotation="0 0 0"></a-gltf-model>
      </a-entity>
      
    </a-scene>
  </body>
</html>
